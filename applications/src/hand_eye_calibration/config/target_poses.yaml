# Camera optical frame positions in base_link (metres).
# Orientation is computed automatically so the camera looks at `look_at`.
# These poses keep the ArUco marker fully visible and avoid the gripper fingers.
look_at: [0.45, 0.00, 0.127]
camera_positions:
  - [0.12, 0.00, 0.34]
  - [0.14, 0.00, 0.36]
  - [0.16, 0.00, 0.38]
  - [0.14, -0.06, 0.36]
  - [0.14, 0.06, 0.36]
  - [0.16, 0.08, 0.34]
  - [0.12, -0.04, 0.38]
  - [0.12, 0.04, 0.38]
